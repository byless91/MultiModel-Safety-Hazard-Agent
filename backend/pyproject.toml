[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-hazard-backend"
version = "0.1.0"
description = "多模态基层安全隐患智能研判与处置辅助系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-hazard-backend"
version = "0.1.0"
description = "多模态基层安全隐患智能研判与处置辅助系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "markitdown[pdf,docx]>=0.1.8",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "alembic>=1.13",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 120
# 迁移脚本为 alembic 生成/模板风格，不适用本项目 lint 规则
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入在参数默认值中调用 Depends/Form/File 属正常用法
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# 测试需先注入 sys.path 再导入被测脚本
"tests/*" = ["E402"]
# StrEnum 迁移涉及 str() 序列化语义，推迟到专门批次处理
"app/eval/dataset.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# 渐进式接入：B0 只检查核心模块；依赖模块静默分析仅提供类型信息
files = ["app/core", "app/services/providers"]
follow_imports = "silent"

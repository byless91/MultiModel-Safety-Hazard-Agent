server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 与受保护的静态文件反代到后端（签名 URL 由后端校验）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }
}

<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 首帧前应用主题，避免暗色用户看到亮色闪烁
      ;(function () {
        try {
          var stored = localStorage.getItem('safety_hazard_theme')
          var dark = stored
            ? stored === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基层安全隐患智能研判</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装依赖（按 uv.lock 锁定版本）
        run: uv sync --frozen --extra dev --extra faiss
      - name: Ruff 静态检查
        run: uv run ruff check . ../test
      - name: Mypy 类型检查（核心模块）
        run: uv run mypy
      - name: 验证数据库迁移可执行（全新库 upgrade head）
        run: |
          DATABASE_URL="sqlite:///./data/ci-migrate.db" uv run alembic upgrade head
          rm -f data/ci-migrate.db
      - name: Pytest 新旧测试（独立进程、隔离数据）
        run: uv run python ../test/run_backend.py --suite all -q

  frontend:
    name: 前端（eslint / vue-tsc / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0  # package.json 在子目录，action 读不到 packageManager，显式指定
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # pnpm 11 要求 Node >= 22.13（node:sqlite）
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖（按锁文件）
        run: pnpm install --frozen-lockfile
      - name: 依赖安全审计（生产依赖严重级失败）
        # tinypool RCE 仅存在于 vitest dev 工具链（不进生产 bundle，vitest 3 钉死 1.x），
        # 生产依赖 critical 硬拦；待 vitest 4 后恢复全量审计
        run: pnpm audit --audit-level critical --prod
      - name: ESLint
        run: pnpm lint 2>&1 | tee /tmp/fe.log || (grep -E "error|✖" /tmp/fe.log | head -6 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: Vitest 单元测试
        run: pnpm test 2>&1 | tee /tmp/fe.log || (grep -E "FAIL|failed" /tmp/fe.log | head -6 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: vue-tsc 类型检查
        run: pnpm type-check 2>&1 | tee /tmp/fe.log || (grep -E "error TS" /tmp/fe.log | head -6 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: 生产构建
        run: pnpm build 2>&1 | tee /tmp/fe.log || (tail -15 /tmp/fe.log | while read -r line; do echo "::error::$line"; done; exit 1)

  backend-pg:
    name: 后端（PostgreSQL 矩阵）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safety
          POSTGRES_PASSWORD: safety
          POSTGRES_DB: safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safety"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
      TEST_DATABASE_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
      R3_TEST_POSTGRES_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
      R4_TEST_POSTGRES_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
      R8_TEST_POSTGRES_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev --extra faiss --extra pg
      - run: uv run alembic upgrade head
      - name: Pytest 新旧测试（PG，独立进程）
        run: uv run python ../test/run_backend.py --suite all -q

  eval-gate:
    name: 评测回归门禁（mock）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - name: 图片、配置、检测指标、数据与门禁合同（假 Provider）
        run: uv run python ../test/run_backend.py --suite new -q -k eval_ --reports-dir ../test/.artifacts/reports/r6-ci
      - name: 隔离 Mock 图片边界集与 schema 2 基线比较（劣化 >2pp 失败）
        run: uv run python ../scripts/check_eval_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-r6-mock
          path: |
            test/.artifacts/evaluation/r6-gate-*/
            test/.artifacts/reports/r6-ci/

  docker:
    name: Compose 业务闭环（${{ matrix.variant }} / Mock）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [sqlite, pg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install httpx==0.28.1
      - name: 空卷部署、业务闭环、持久化及故障就绪验证
        run: python test/e2e/compose_smoke.py --variant ${{ matrix.variant }} --build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-${{ matrix.variant }}
          path: test/.artifacts/reports/r5-compose-*.json

  browser-e2e:
    name: 图片研判与整改浏览器闭环（Mock）
    runs-on: ubuntu-latest
    env:
      PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev --extra faiss
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: 安装测试浏览器
        run: node frontend/node_modules/playwright-core/cli.js install chromium --with-deps
      - name: 复核操作、长任务恢复和三角色整改闭环
        run: |
          node test/e2e/viewport-layout.mjs
          node test/e2e/human-review.mjs
          node test/e2e/async-resume.mjs
          node test/e2e/assessment-lifecycle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-browser-evidence
          path: |
            test/.artifacts/reports/r7-*/
            test/.artifacts/reports/r8-final/viewport-layout.json

  pip-audit:
    name: 后端依赖安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 导出锁定依赖并审计
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装依赖（按 uv.lock 锁定版本）
        run: uv sync --frozen --extra dev --extra faiss
      - name: Ruff 静态检查
        run: uv run ruff check . ../test
      - name: Mypy 类型检查（核心模块）
        run: uv run mypy
      - name: 验证数据库迁移可执行（全新库 upgrade head）
        run: |
          DATABASE_URL="sqlite:///./data/ci-migrate.db" uv run alembic upgrade head
          rm -f data/ci-migrate.db
      - name: Pytest 新旧测试（独立进程、隔离数据）
        run: uv run python ../test/run_backend.py --suite all -q

  frontend:
    name: 前端（eslint / vue-tsc / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0  # package.json 在子目录，action 读不到 packageManager，显式指定
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # pnpm 11 要求 Node >= 22.13（node:sqlite）
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖（按锁文件）
        run: pnpm install --frozen-lockfile
      - name: 依赖安全审计（生产依赖严重级失败）
        # tinypool RCE 仅存在于 vitest dev 工具链（不进生产 bundle，vitest 3 钉死 1.x），
        # 生产依赖 critical 硬拦；待 vitest 4 后恢复全量审计
        run: pnpm audit --audit-level critical --prod
      - name: ESLint
        run: pnpm lint 2>&1 | tee /tmp/fe.log || (grep -E "error|✖" /tmp/fe.log | head -6 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: Vitest 单元测试
        run: pnpm test 2>&1 | tee /tmp/fe.log || (grep -E "FAIL|failed" /tmp/fe.log | head -6 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: vue-tsc 类型检查
        run: pnpm type-check 2>&1 | tee /tmp/fe.log || (grep -E "error TS" /tmp/fe.log | head -6 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: 生产构建
        run: pnpm build 2>&1 | tee /tmp/fe.log || (tail -15 /tmp/fe.log | while read -r line; do echo "::error::$line"; done; exit 1)

  backend-pg:
    name: 后端（PostgreSQL 矩阵）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safety
          POSTGRES_PASSWORD: safety
          POSTGRES_DB: safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safety"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
      TEST_DATABASE_URL: postgresql+psycopg://safety:safety@localhost:5432/safety_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev --extra faiss --extra pg
      - run: uv run alembic upgrade head
      - name: Pytest 新旧测试（PG，独立进程）
        run: uv run python ../test/run_backend.py --suite all -q

  eval-gate:
    name: 评测回归门禁（mock）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - name: 跑 mock 评测并与基线对比（劣化 >2pp 失败）
        run: uv run python ../scripts/check_eval_baseline.py

  docker:
    name: 容器镜像构建与冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 构建并起全栈
        run: docker compose up -d --build 2>&1 | tee /tmp/compose.log || (grep -E "ERROR|error:" /tmp/compose.log | tail -8 | while read -r line; do echo "::error::$line"; done; exit 1)
      - name: 全栈健康检查
        run: |
          set +e
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8001/api/v1/health > /dev/null; then echo "backend healthy"; break; fi
            sleep 5
          done
          ok=0
          curl -sf http://localhost:8001/api/v1/health | grep -q '"status":"ok"' && ok=1
          curl -sf http://localhost:8080/ | grep -q "基层安全隐患" && ok=$((ok+1))
          if [ "$ok" -lt 2 ]; then
            echo "::error::compose 冒烟失败 ok=$ok"
            docker compose logs --tail 20 2>/dev/null | while read -r line; do echo "::error::$line"; done
            docker compose down -v
            exit 1
          fi
          docker compose down -v

  pip-audit:
    name: 后端依赖安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 导出锁定依赖并审计
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt

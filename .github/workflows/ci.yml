name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装依赖（按 uv.lock 锁定版本）
        run: uv sync --frozen --extra dev --extra faiss
      - name: Ruff 静态检查
        run: uv run ruff check .
      - name: Mypy 类型检查（核心模块）
        run: uv run mypy
      - name: Pytest 单元测试
        run: uv run pytest -q -p no:cacheprovider

  frontend:
    name: 前端（eslint / vue-tsc / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本读取自 frontend/package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖（按锁文件）
        run: pnpm install --frozen-lockfile
      - name: 依赖安全审计（高危及以上失败）
        run: pnpm audit --audit-level high
      - name: ESLint
        run: pnpm lint
      - name: vue-tsc 类型检查
        run: pnpm type-check
      - name: 生产构建
        run: pnpm build

  pip-audit:
    name: 后端依赖安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 导出锁定依赖并审计
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt
